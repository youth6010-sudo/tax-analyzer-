<script type="text/javascript">
	var DaumMap;
	
	async function gfn_showMessage() {
		var msg = "";

		if (msg != "")
			await modalService.alert(msg);
	}

	$(document).ready(function() {
		(async function () {
			await gfn_showMessage();
			init(); 
		})();
	});
		
	
	function init() {
						
		var position = new kakao.maps.LatLng(35.8043784934024, 126.901124901441); // 기본 위치 WGS84 좌표
		DaumMap = new kakao.maps.Map(document.getElementById('DaumMap'), {
			center: position, // 좌표로 지정한 곳이 지도의 중심
			level: 4, // 확대 수준(0~14)
			mapTypeId: kakao.maps.MapTypeId.ROADMAP // 지도 종류(MapTypeId.HYBRID: 스카이뷰 사진에 다양한 기호, MapTypeId.ROADMAP: 일반지도)
		});

		var zoomControl = new kakao.maps.ZoomControl(); // 지도 확대/축소 컨트롤바
		DaumMap.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);
		var mapTypeControl = new kakao.maps.MapTypeControl(); // 지도 종류 변경 컨트롤바
		DaumMap.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);
		
		var markerpostion = new kakao.maps.LatLng(35.8043784934024, 126.901124901441); // 기본 위치 WGS84 좌표
		var icon = new kakao.maps.MarkerImage("/daumMap/nhic_marker.png",
											new kakao.maps.Size(25, 33),
											new kakao.maps.Point(13, 33));
		
		var marker = new kakao.maps.Marker({ // 현재 위치 표시 마커 생성
			position: markerpostion,
			image: icon
		});
		marker.setMap(DaumMap);

		// 마커에 말풍선 추가 시작
		var infowindow = new kakao.maps.InfoWindow({ 
		content:  '<p style="text-align:center; width:150px; padding:5px 5px 5px 5px;  font-size:9pt;">김제지사</p>',
		removable : false
		}); 
		infowindow.open(DaumMap, marker); 
		// 마커에 말풍선 추가 끝
		
	}
